name: ci

on:
  push:
  pull_request:

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner matches its golden file
        run: python3 -I bench/scanner_golden.py

  comparators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::jsonlite
            any::haven
      - name: Comparator self-tests (planted errors)
        run: Rscript tests/run.R

  eval-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluation Set v1 bench files unchanged
        run: python3 -I eval/v1.py --root "$RUNNER_TEMP/forward2028-not-here" --bench .
